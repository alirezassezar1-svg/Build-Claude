async function unzip(buf){const v=new DataView(buf),u=new Uint8Array(buf);let e=u.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw Error('not a valid zip');const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const F={};

function bundle(F,path){const dir=path.replace(/[^/]*$/,''),get=u=>F[norm(dir+decodeURI(u.split('?')[0]))];let h=td(F[path]);

function md2html(s){let h=esc(s).replace(/```([\s\S]*?)```/g,(m,c)=>`<pre>${c}</pre>`).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2">$1</a>').replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);return h.split(/\n{2,}/).map(x=>/^<(h\d|ul|pre)/.test(x.trim())?x:`<p>${x.replace(/\n/g,'<br>')}</p>`).join('')}
